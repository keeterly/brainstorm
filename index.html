<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The sky zooms, the interface does not: pinching a map is the point of
         having one, pinching the chrome slides the tab bar off the bottom of an
         installed app with no browser UI left to undo it. See src/lib/nozoom.ts
         for the two refusals this one cannot make on its own. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#04050a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Brainstorm" />
    <meta
      name="description"
      content="Brainstorm — AI Thinking OS. Turn scattered thoughts into connected ideas, visual maps, and actionable plans."
    />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Brainstorm</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
