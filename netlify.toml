# Brainstorm — Netlify configuration
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # The Supabase URL and anon key are public by design — they ship in the
  # client bundle and RLS is the security boundary. Without this exemption
  # Netlify's secrets scanner finds them in dist/ and fails every build.
  # ANTHROPIC_API_KEY stays scanned: it is server-only and never in output.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback — function paths self-route via `export const config = { path }`.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The shell and the service worker must always revalidate so fresh deploys
# propagate immediately (hashed assets are immutable and cache themselves).
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
