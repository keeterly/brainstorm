# Check every push. Deploying is Netlify's job — it builds this repo from Git
# on its own, and a second deploy from here only ever raced it. This workflow
# is here to tell you when a push breaks the build, not to ship it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The client bundle reads these at build time. They are the project URL
      # and the publishable anon key — nothing secret — and the build has to
      # pass without them anyway, so a missing one is not a failure.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # …and then open it.
      #
      # Everything above this line checks the app by reading it: the domain
      # tests import real functions, and the source pins read SkyPage.tsx as a
      # string, which is the only handle anybody has on an eight-thousand-line
      # imperative closure. None of it can notice that a control renders and is
      # covered, that a page opens and paints nothing, or that a tap is wired to
      # the wrong handler. Those need a browser, and until now there was not one
      # in here — a push that broke the sky went green.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
