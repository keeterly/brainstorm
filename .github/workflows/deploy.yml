# Build on the runner and deploy straight to Netlify production on push to
# main (bypasses Netlify build minutes — same pattern as venia-agents CI).
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   NETLIFY_AUTH_TOKEN  — a Netlify personal access token
#   NETLIFY_SITE_ID     — the site's API ID
#   VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY — baked into the client bundle
# (ANTHROPIC_API_KEY etc. are runtime function env vars — set those on the
# Netlify site itself, not here.)
name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx netlify-cli deploy --prod --dir dist --site "$NETLIFY_SITE_ID"
